<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Récupération Mamie à la banque</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f7f7;color:#173737;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:680px;margin:auto;padding:18px 14px 40px}h1{font-size:24px}.warning,.ok,.card{border-radius:12px;padding:13px;margin:12px 0}.warning{background:#fff3cd;border:1px solid #ffe69c}.ok{background:#eaf7ef;border:1px solid #b8e0c5}.card{background:#fff;border:1px solid #dce7e7}button{width:100%;border:0;border-radius:11px;padding:13px;font-size:16px;font-weight:700;background:#116a6a;color:#fff;margin-top:8px}.secondary{background:#fff;color:#116a6a;border:1px solid #9cc4c4}.meta{font-size:13px;color:#607979;margin-top:5px;overflow-wrap:anywhere}.badge{display:inline-block;background:#edf4f4;border-radius:999px;padding:4px 8px;margin:5px 4px 0 0;font-size:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;max-height:220px;overflow:auto;background:#f6f8f8;padding:8px;border-radius:8px}</style>
</head><body><main><h1>🔎 Récupération</h1>
<div class="warning"><strong>LECTURE SEULE.</strong><br>Cette page ne supprime, ne remplace et ne modifie aucune donnée.</div>
<button id="scan">Rechercher toutes les données présentes</button><div id="summary"></div><div id="results"></div>
<script>
(function(){"use strict";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function analyse(raw){let tx=null,rec=null;try{let p=JSON.parse(raw),d=(p&&p.data&&typeof p.data==="object")?p.data:p;if(d&&Array.isArray(d.transactions))tx=d.transactions.length;if(d&&Array.isArray(d.recurring))rec=d.recurring.length}catch(e){}return{tx,rec}}
function dl(key,raw){let b=new Blob([raw],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="RECUP-"+key.replace(/[^a-z0-9_-]/gi,"_")+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
document.getElementById("scan").onclick=()=>{let rows=[];for(let i=0;i<localStorage.length;i++){let key=localStorage.key(i),raw="";try{raw=localStorage.getItem(key)||""}catch(e){}rows.push({key,raw,...analyse(raw)})}rows.sort((a,b)=>(/mamie|banque/i.test(a.key)?0:1)-(/mamie|banque/i.test(b.key)?0:1)||a.key.localeCompare(b.key));document.getElementById("summary").innerHTML='<div class="ok"><strong>'+rows.length+' clé(s) trouvée(s).</strong><br>Cherche celles avec des opérations ou récurrents supérieurs à 0.</div>';let out=document.getElementById("results");out.innerHTML="";if(!rows.length){out.innerHTML='<div class="card"><strong>Aucune clé localStorage visible pour cette adresse.</strong></div>';return}rows.forEach((r,i)=>{let d=document.createElement("div");d.className="card";d.innerHTML='<strong>'+esc(r.key)+'</strong><div><span class="badge">Opérations : '+(r.tx===null?"inconnu":r.tx)+'</span><span class="badge">Récurrents : '+(r.rec===null?"inconnu":r.rec)+'</span><span class="badge">'+r.raw.length+' caractères</span></div><div class="meta">Aucune modification effectuée.</div><button class="secondary" data-i="'+i+'">Télécharger une copie</button><details><summary class="meta">Voir un aperçu</summary><pre>'+esc(r.raw.slice(0,5000))+'</pre></details>';out.appendChild(d)});document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{let r=rows[+b.dataset.i];dl(r.key,r.raw)})};
})();
</script></main></body></html>
